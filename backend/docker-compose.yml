services:
  rabbitmq:
    # Pinned, not `:management` alone, which floats to whatever is newest.
    image: rabbitmq:3.13-management
    container_name: pwm-rabbitmq
    hostname: pwm-rabbitmq
    ports:
      # AMQP - published to the host too, not just the compose network, so
      # `dotnet run --project pwm.WebAPI` still works as a local-iteration
      # alternative to the containerized `api` service below; 15672 is the
      # management UI, for a human to look at the queue while reproducing a
      # problem.
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    # pwm.WebAPI, containerized like the other three - the seminar's own
    # rules (section 3.2) call for API, worker, RabbitMQ and the database all
    # living in this file. `dotnet run --project pwm.WebAPI` against the same
    # RabbitMQ/SQL Server (published on the host ports below) still works for
    # local iteration; just don't run both at once, they'd fight over :7094.
    build:
      context: ./pwm
      dockerfile: pwm.WebAPI/Dockerfile
    container_name: pwm-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set}"
      ConnectionStrings__PWMConnection: "Server=sqlserver,1433;Database=210050;User Id=sa;TrustServerCertificate=True;MultipleActiveResultSets=True"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: "${RabbitMq__UserName:-guest}"
      RabbitMq__Password: "${RabbitMq__Password:-guest}"
      RabbitMq__ReportQueueName: "${RabbitMq__ReportQueueName:-report-generation}"
    ports:
      # Same port the frontend apps default to (baseUrl/String.fromEnvironment).
      - "7094:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # pwm.Worker is its own container and its own process - see the notes on
    # section 3.2: a BackgroundService inside pwm.WebAPI would not qualify.
    build:
      context: ./pwm
      dockerfile: pwm.Worker/Dockerfile
    container_name: pwm-worker
    environment:
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set}"
      ConnectionStrings__PWMConnection: "Server=sqlserver,1433;Database=210050;User Id=sa;TrustServerCertificate=True;MultipleActiveResultSets=True"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: "${RabbitMq__UserName:-guest}"
      RabbitMq__Password: "${RabbitMq__Password:-guest}"
      RabbitMq__ReportQueueName: "${RabbitMq__ReportQueueName:-report-generation}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  sqlserver:
    # Pinned to the build (16.0.4250.1) this project was seeded and tested against,
    # rather than 2022-latest, which moves.
    image: mcr.microsoft.com/mssql/server:2022-CU24-GDR1-ubuntu-22.04
    container_name: project-work-manager
    hostname: project-work-manager
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set}"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    expose:
      - "1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mssql-data:
